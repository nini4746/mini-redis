name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install redis-cli (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y redis-tools netcat-openbsd
      - name: Install redis-cli (macOS)
        if: runner.os == 'macOS'
        run: brew install redis
      - run: make test
